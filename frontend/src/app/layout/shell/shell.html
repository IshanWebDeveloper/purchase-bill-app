<header class="topbar">
  <a class="brand" routerLink="/dashboard">
    <span class="material-symbols-outlined" aria-hidden="true">receipt_long</span>
    Purchase Bill
  </a>
  <span class="spacer"></span>
  <span class="user" data-testid="user-name">
    <span class="material-symbols-outlined" aria-hidden="true">account_circle</span>
    {{ auth.displayName() }}
  </span>
  <button type="button" mat-icon-button aria-label="Log out" title="Log out" (click)="auth.logout()">
    <mat-icon fontSet="material-symbols-outlined">logout</mat-icon>
  </button>
</header>

<nav class="sidebar" aria-label="Main">
  @for (link of links; track link.path) {
    <a [routerLink]="link.path" routerLinkActive="active" ariaCurrentWhenActive="page">
      <span class="material-symbols-outlined" aria-hidden="true">{{ link.icon }}</span>
      <span class="label">{{ link.label }}</span>
    </a>
  }
</nav>

<main class="content">
  <router-outlet />
</main>
