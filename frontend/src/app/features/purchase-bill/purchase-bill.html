<header class="topbar">
  <h1>Purchase Bill</h1>
  <span class="user">{{ auth.displayName() }}</span>
  <button mat-stroked-button type="button" (click)="auth.logout()">Log out</button>
</header>

@if (loadingLocations() || saving()) {
  <mat-progress-bar mode="indeterminate" [attr.aria-label]="saving() ? 'Saving purchase bill' : 'Loading batches'" />
}

<main class="content">
  @if (locationsError()) {
    <div class="banner" role="alert">
      <span>Could not load batches. {{ locationsError() }}</span>
      <button mat-button type="button" (click)="loadLocations()">Retry</button>
    </div>
  }

  <section class="card" aria-labelledby="add-item-title">
    <h2 id="add-item-title">Add item</h2>
    <app-item-form [locations]="locations()" (added)="addRow($event)" />
  </section>

  <div class="lower">
    <section class="card" aria-labelledby="items-title">
      <h2 id="items-title">Items</h2>
      <app-item-table [rows]="rows()" [disabled]="saving()" (removed)="removeRow($event)" />
    </section>

    <section class="card summary" aria-label="Item summary">
      <app-summary-panel [totalItems]="totalItems()" [totalQuantity]="totalQuantity()">
        @if (savedMessage()) {
          <p class="success" role="status">{{ savedMessage() }}</p>
        }
        @if (saveError()) {
          <p class="error" role="alert">{{ saveError() }}</p>
        }
        <button
          mat-flat-button
          type="button"
          class="save"
          [disabled]="rows().length === 0 || saving()"
          (click)="save()"
        >
          {{ saving() ? 'Saving…' : 'Save purchase bill' }}
        </button>
      </app-summary-panel>
    </section>
  </div>
</main>
